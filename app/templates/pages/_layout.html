{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-brand mb-2">{% block heading %}{% endblock %}</h1>
    <p class="text-sm text-slate-500 mb-8">{% block sub %}{% endblock %}</p>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-5 leading-relaxed [&_h2]:text-lg [&_h2]:font-semibold [&_h2]:text-brand [&_h2]:pt-2 [&_ul]:list-disc [&_ul]:pl-6 [&_ul]:space-y-1 [&_a]:text-blue-700 [&_a]:underline">
        {% block body %}{% endblock %}
    </div>
</div>
{% endblock %}
